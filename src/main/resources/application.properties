spring.application.name=RideShare

spring.datasource.url=jdbc:postgresql://localhost:5432/rideshare_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

##spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# update: добавит недостающие колонки (например password_hash). Для строгой проверки схемы в проде — validate
# и тогда один раз выполните scripts/postgres-add-user-password-hash.sql
spring.jpa.hibernate.ddl-auto=update

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
logging.file.path=logs

# Admin JWT (change secret and password in production)
app.security.admin.username=admin
app.security.admin.password=admin
app.security.jwt.secret=rideshare-dev-jwt-secret-change-me-32b-min!!
app.security.jwt.expiration-minutes=720

# Период обновления статусов поездок по времени (мс)
app.rides.status-refresh-ms=60000
