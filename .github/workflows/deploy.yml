name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository_owner }}_backend
  FRONTEND_IMAGE: ${{ github.repository_owner }}_frontend

jobs:
  test-backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Run backend tests
        run: |
          mvn clean test
          mvn checkstyle:check

  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'Frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./Frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./Frontend
        run: npm run build

  build-and-push:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - uses: actions/checkout@v4

      - name: Convert repository owner to lowercase
        run: |
          echo "LOWER_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.LOWER_OWNER }}/backend:latest
            ${{ env.REGISTRY }}/${{ env.LOWER_OWNER }}/backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.LOWER_OWNER }}/frontend:latest
            ${{ env.REGISTRY }}/${{ env.LOWER_OWNER }}/frontend:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download and Install Railway CLI
        run: |
          curl -L https://github.com/railwayapp/cli/releases/download/v3.19.0/railway-v3.19.0-x86_64-unknown-linux-musl.tar.gz -o railway.tar.gz
          tar -xzf railway.tar.gz
          sudo mv railway /usr/local/bin/
          rm railway.tar.gz

      - name: Deploy to Railway
        run: railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Wait for deployment
        run: sleep 15

      - name: Healthcheck Backend
        run: |
          for i in {1..12}; do
            if curl -f https://rideshare-production-7f46.up.railway.app/swagger-ui.html; then
              echo "Backend healthcheck passed!"
              exit 0
            fi
            echo "Waiting for backend... (attempt $i/12)"
            sleep 10
          done
          echo "Backend healthcheck failed"
          exit 1

      - name: Healthcheck Frontend
        run: |
          for i in {1..12}; do
            if curl -f https://ridesharefrontend-production.up.railway.app/health; then
              echo "Frontend healthcheck passed!"
              exit 0
            fi
            echo "Waiting for frontend... (attempt $i/12)"
            sleep 10
          done
          echo "Frontend healthcheck failed"
          exit 1