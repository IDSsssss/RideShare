name: CI/CD Pipeline

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  NODE_VERSION: "20"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Build frontend
        working-directory: Frontend
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build backend
        run: ./mvnw -B -DskipTests clean package

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Build frontend
        working-directory: Frontend
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw -B verify

  docker-build:
    name: Docker build and push
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert to lowercase
        run: |
          echo "LOWER_REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.LOWER_REPO }}-backend:latest
            ghcr.io/${{ env.LOWER_REPO }}-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend
          push: true
          tags: |
            ghcr.io/${{ env.LOWER_REPO }}-frontend:latest
            ghcr.io/${{ env.LOWER_REPO }}-frontend:${{ github.sha }}

  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read

    steps:
      - name: Trigger Railway deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_TOKEN secret is not set" >&2
            exit 1
          fi
          if [ -z "$RAILWAY_PROJECT_ID" ]; then
            echo "RAILWAY_PROJECT_ID secret is not set" >&2
            exit 1
          fi
          curl -fsS -X POST "https://api.railway.com/v1/projects/${RAILWAY_PROJECT_ID}/deployments" \
            -H "Authorization: Bearer ${RAILWAY_TOKEN}" \
            -H "Content-Type: application/json"

  healthcheck:
    name: Healthcheck
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read

    steps:
      - name: Wait for startup
        run: sleep 60

      - name: Check backend health with retries
        env:
          BACKEND_URL: ${{ secrets.RAILWAY_BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "RAILWAY_BACKEND_URL secret is not set" >&2
            exit 1
          fi

          BASE="${BACKEND_URL%/}"
          for i in {1..45}; do
            RESPONSE=$(curl -fsS "${BASE}/swagger-ui.html" || true)
            if echo "$RESPONSE" | grep -q "Swagger UI"; then
              echo "✅ Backend healthcheck passed"
              exit 0
            fi
            echo "⏳ Backend healthcheck attempt $i failed, retrying in 20s..."
            sleep 20
          done
          echo "❌ Backend service is not healthy after retries" >&2
          exit 1

      - name: Check frontend health with retries
        env:
          FRONTEND_URL: ${{ secrets.RAILWAY_FRONTEND_URL }}
        run: |
          if [ -z "$FRONTEND_URL" ]; then
            echo "RAILWAY_FRONTEND_URL secret is not set" >&2
            exit 1
          fi

          BASE="${FRONTEND_URL%/}"
          for i in {1..45}; do
            RESPONSE=$(curl -fsS "${BASE}/health" || true)
            if echo "$RESPONSE" | grep -q "healthy"; then
              echo "✅ Frontend healthcheck passed"
              exit 0
            fi
            echo "⏳ Frontend healthcheck attempt $i failed, retrying in 20s..."
            sleep 20
          done
          echo "❌ Frontend service is not healthy after retries" >&2
          exit 1